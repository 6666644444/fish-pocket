# 开发分支的 iOS CI：在模拟器上编译 App 并运行单元测试（DshIOSTests）。
# 和 ios-build.yml 的区别：那个只在 main / release 的 PR 上编译；这个在开发分支每次推送时
# 编译 + 跑测试，给没有 Mac 的开发流程当「编译器」用。
# macOS 分钟很贵：nodejs-mobile、Python、FFmpeg 的下载和 libgit2 的构建结果都按生成它们的
# 脚本哈希缓存；SwiftPM 依赖按 project.yml 缓存；只改文档的提交跳过。不用 -xlarge 机型。
name: iOS CI

on:
  push:
    branches: ["feat/**", "fix/**", "ci/**"]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The learning plugin's Node tests, on Linux: free on a public repo and done in a few
  # minutes, so engine-only changes get an answer without waiting for macOS.
  # Only test/learning-*.test.mjs and the firefly-typeset plugin's test run here. The other engine tests target the app's
  # macOS/iOS layout (paths, shell, the git addon built by scripts/build-git-addon.sh);
  # on Windows 32 of them fail for that reason, so running them here would say nothing
  # about our change. See DECISIONS.md.
  engine-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24.20'
          cache: npm
          cache-dependency-path: engine/package-lock.json
      - name: Install
        working-directory: engine
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Learning tests
        working-directory: engine
        run: |
          node --version
          node --test --test-reporter=spec test/learning-*.test.mjs test/typeset-plugin.test.mjs

  build-and-test:
    # 原定 macos-26，但它连续三次排队 15 分钟都没有机器接单（GitHub 提示 macOS arm64 容量不足），
    # 见 OPEN_QUESTIONS.md 第 1 条。默认改用上游 ios-build.yml 的 xcode-27；
    # 设置仓库变量 IOS_CI_RUNNER=macos-26 即可切回。不用 -xlarge。
    runs-on: ${{ vars.IOS_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      # 选镜像里版本号最高的 Xcode。ios-build.yml 注释提到旧编译器会拒绝部分 SwiftUI 代码，
      # 所以尽量用最新的；实际选中的版本打印在日志里，缓存键也带上它。
      - name: Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app
          latest="$(ls -d /Applications/Xcode_*.app | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1#' | grep -E '^[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          sudo xcode-select -s "/Applications/Xcode_${latest}.app"
          xcodebuild -version
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      # 只缓存安装产物和 xcframework，源码和中间构建目录不进缓存。libgit2 用 clang 编译，键带 Xcode 版本。
      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        working-directory: app
        run: xcodegen generate --quiet

      # SwiftPM 依赖（SwiftTerm、SwiftMath）：版本钉在 project.yml 里，按它缓存。
      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: app/build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/project.yml') }}

      # 找一台可用的 iPhone 模拟器（arm64），测试需要具体设备，generic 目的地跑不了测试。
      # 优先选普通机型（iPhone 17 / iPhone 17 Pro 这类）：上次随手取了最后一台「iPhone Duo」
      # （预览镜像里的新机型），装测试程序时模拟器服务崩溃（Mach error -308）。
      # 选好后先启动并等它完全就绪，不让 xcodebuild 在冷启动中途安装。
      # 设备从 xcodebuild -showdestinations 里选，而不是 simctl：镜像里有两套 iOS 27.2 运行时，
      # simctl 列出的「iPhone 17 (27.2)」xcodebuild 并不认（Unable to find a device matching…）。
      - name: Pick and boot simulator
        id: sim
        working-directory: app
        run: |
          dests="$(xcodebuild -project DshIOS.xcodeproj -scheme DshIOS -showdestinations 2>/dev/null \
            | grep -F 'platform:iOS Simulator' | grep -F 'arch:arm64' | grep -F 'name:iPhone' | grep -vE 'name:iPhone (Duo|Fold)')"
          echo "$dests"
          # 普通机型优先（iPhone 17 / iPhone 18 Pro），同名取 OS 最高的。
          line="$( { echo "$dests" | grep -E 'name:iPhone [0-9]+( Pro)? \}'; echo "$dests"; } \
            | awk -F'OS:' 'NF>1{split($2,a,","); print a[1]"\t"$0}' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -f2-)"
          first_plain="$(echo "$dests" | grep -E 'name:iPhone [0-9]+( Pro)? \}' \
            | awk -F'OS:' 'NF>1{split($2,a,","); print a[1]"\t"$0}' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1 | cut -f2-)"
          [ -n "$first_plain" ] && line="$first_plain"
          udid="$(echo "$line" | sed -nE 's/.*id:([0-9A-F-]{36}).*/\1/p')"
          [ -n "$udid" ] || { echo "no iPhone simulator xcodebuild accepts" >&2; exit 1; }
          echo "picked: $line"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # vendored 的 xcframework 只有 arm64，所以固定 ARCHS=arm64。不签名。
      - name: Build and test (iOS simulator)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            -resultBundlePath build/TestResults.xcresult \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO \
            test -quiet

      # -quiet 会把测试结果也藏起来：从结果包里读出用例数并打印。一个用例都没跑也算失败，
      # 免得测试目标没接上时 CI 依然显示绿色。
      - name: Test summary
        if: always()
        working-directory: app
        run: |
          [ -d build/TestResults.xcresult ] || { echo "no result bundle" >&2; exit 1; }
          summary="$(xcrun xcresulttool get test-results summary --path build/TestResults.xcresult --compact)"
          echo "$summary" | jq '{result, totalTestCount, passedTests, failedTests, skippedTests}'
          xcrun xcresulttool get test-results tests --path build/TestResults.xcresult --compact \
            | jq -r '.. | objects | select(.nodeType? == "Test Case") | "\(.result)\t\(.name)"' || true
          total="$(echo "$summary" | jq -r '.totalTestCount // 0')"
          # Findings the learning tests print (NLEmbedding evaluation, docs/PLAN.md §12.6). -quiet
          # hides test output, so the test also writes them to the host's home and attaches them.
          if [ -s "$HOME/nlembed.txt" ]; then
            cat "$HOME/nlembed.txt"
          else
            mkdir -p build/attachments
            xcrun xcresulttool export attachments --path build/TestResults.xcresult --output-path build/attachments >/dev/null 2>&1 || true
            grep -rah 'NLEMBED' build/attachments 2>/dev/null || echo "NLEMBED: no evaluation lines found"
          fi
          [ "$total" -gt 0 ] || { echo "no unit tests ran" >&2; exit 1; }

      # The learning plugin's SQLite on the real NodeMobile in the simulator booted above:
      # node:sqlite, the trigram tokenizer and the store under /home/dsh (DECISIONS.md D1, D4).
      # A new script beside upstream's test-root-sim.sh, which stays untouched.
      - name: Learning SQLite on NodeMobile
        timeout-minutes: 10
        env:
          SIM_DEVICE: ${{ steps.sim.outputs.udid }}
        run: scripts/test-learning-sim.sh

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: app/build/TestResults.xcresult
          retention-days: 5
          if-no-files-found: ignore
