# Build an unsigned IPA of this branch for the maintainer to sign himself (personal use, not
# distributed; DECISIONS.md D33). Same vendor and engine steps as ios-ci.yml, then a Release
# build for real iPhones (arm64) with code signing off, packed as Payload/DshIOS.app in
# Firefly.ipa and kept as a workflow artifact for 10 days.
#
# Runs when: this file changes on a feat/** branch, a tag ipa-* is pushed
# (git tag ipa-20261126 && git push origin ipa-20261126), or by hand (workflow_dispatch).
name: Unsigned IPA

on:
  push:
    branches: ["feat/**"]
    paths: [".github/workflows/ios-ipa.yml"]
    tags: ["ipa-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: ${{ vars.IOS_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        id: xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1#' | grep -E '^[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          sudo xcode-select -s "/Applications/Xcode_${latest}.app"
          xcodebuild -version
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      # The same caches as ios-ci.yml (same keys), so a CI run warms them for this one.
      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        working-directory: app
        run: xcodegen generate --quiet

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: app/build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/project.yml') }}

      # Release, for devices, unsigned: the signer adds the identity and the provisioning
      # profiles. The Python post-build step signs ad hoc when no identity is set (project.yml).
      - name: Build (iOS device, unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Pack IPA
        working-directory: app
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables). Empty: that
          # IPA is not made. IPA_BUNDLE_ID / IPA_APP_GROUP match the maintainer's provisioning profile;
          # IPA_FREE_BUNDLE_ID / IPA_FREE_APP_GROUP are IDs of his own for signing with a free Apple ID.
          IPA_BUNDLE_ID: ${{ vars.IPA_BUNDLE_ID }}
          IPA_APP_GROUP: ${{ vars.IPA_APP_GROUP }}
          IPA_FREE_BUNDLE_ID: ${{ vars.IPA_FREE_BUNDLE_ID }}
          IPA_FREE_APP_GROUP: ${{ vars.IPA_FREE_APP_GROUP }}
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/DshIOS.app"
          [ -d "$app" ] || { echo "no $app" >&2; ls build/DerivedData/Build/Products || true; exit 1; }
          pb=/usr/libexec/PlistBuddy
          version="$($pb -c 'Print CFBundleShortVersionString' "$app/Info.plist")"
          build="$($pb -c 'Print CFBundleVersion' "$app/Info.plist")"
          name="$($pb -c 'Print CFBundleDisplayName' "$app/Info.plist")"
          built_id="$($pb -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          base="Firefly-$version-$build"
          notes=""
          pack() { rm -rf ipa && mkdir -p ipa/Payload && cp -R "$1" ipa/Payload/ && (cd ipa && zip -qry "../$2" Payload); }
          copy() { rm -rf "build/$1" && mkdir -p "build/$1" && cp -R "$app" "build/$1/DshIOS.app" && echo "build/$1/DshIOS.app"; }
          # Every bundle whose ID starts with the built app's gets NEW_ID in its place (.Share,
          # .LiveActivity, .watchkitapp kept); the App Group the bundles read and the watch app's
          # companion ID follow; the background-task prefix of the new ID is permitted.
          retarget() {
            local dir="$1" new_id="$2" group="$3" plist old new
            while IFS= read -r plist; do
              old="$($pb -c 'Print CFBundleIdentifier' "$plist" 2>/dev/null || true)"
              case "$old" in "$built_id"|"$built_id".*) ;; *) continue ;; esac
              new="$new_id${old#"$built_id"}"
              $pb -c "Set :CFBundleIdentifier $new" "$plist"
              if [ -n "$group" ] && $pb -c 'Print DshAppGroup' "$plist" >/dev/null 2>&1; then
                $pb -c "Set :DshAppGroup $group" "$plist"
              fi
              if $pb -c 'Print WKCompanionAppBundleIdentifier' "$plist" >/dev/null 2>&1; then
                $pb -c "Set :WKCompanionAppBundleIdentifier $new_id" "$plist"
              fi
              notes="$notes\n    $new"
            done < <(find "$dir" -name Info.plist -not -path '*/Frameworks/*' -not -path '*/python/*')
            $pb -c "Add :BGTaskSchedulerPermittedIdentifiers: string $new_id.task.*" "$dir/Info.plist" 2>/dev/null || true
          }

          # 1. Everything as built (upstream's IDs).
          pack "$app" "$base.ipa"
          notes="$notes\n$base.ipa: as built ($built_id), extensions and watch app included"

          # 2. One provisioning profile, one explicit App ID: no extensions or watch app.
          if [ -n "${IPA_BUNDLE_ID:-}" ]; then
            one="$(copy single-profile)"
            rm -rf "$one/PlugIns" "$one/Watch"
            notes="$notes\n$base-single-profile.ipa: no extensions or watch app"
            retarget "$one" "$IPA_BUNDLE_ID" "${IPA_APP_GROUP:-}"
            pack "$one" "$base-single-profile.ipa"

            # 3. Everything, for one provisioning profile per bundle.
            all="$(copy full-profile)"
            notes="$notes\n$base-full-profile.ipa: extensions and watch app, one profile per bundle"
            retarget "$all" "$IPA_BUNDLE_ID" "${IPA_APP_GROUP:-}"
            pack "$all" "$base-full-profile.ipa"
          fi

          # 4. A free Apple ID (Sideloadly and the like): IDs of our own, which a free account can
          #    register; no watch app, as a free account installs at most 3 apps and each extension
          #    counts. Signed ad hoc with the App Group entitlement, so the signer sees what to
          #    request; it re-signs everything with the account's certificate.
          if [ -n "${IPA_FREE_BUNDLE_ID:-}" ]; then
            free="$(copy free-apple-id)"
            rm -rf "$free/Watch"
            notes="$notes\n$base-free-apple-id.ipa: share and widget extensions, no watch app"
            retarget "$free" "$IPA_FREE_BUNDLE_ID" "${IPA_FREE_APP_GROUP:-}"
            if [ -n "${IPA_FREE_APP_GROUP:-}" ]; then
              ents="$RUNNER_TEMP/app-group.entitlements"
              printf '<?xml version="1.0" encoding="UTF-8"?>\n<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n<plist version="1.0"><dict><key>com.apple.security.application-groups</key><array><string>%s</string></array></dict></plist>\n' "$IPA_FREE_APP_GROUP" > "$ents"
              if codesign --force --deep --sign - "$free" >/dev/null 2>&1; then
                for ext in "$free"/PlugIns/*.appex; do
                  if [ -d "$ext" ]; then codesign --force --sign - --entitlements "$ents" "$ext"; fi
                done
                codesign --force --sign - --entitlements "$ents" "$free"
                if codesign -d --entitlements - "$free" 2>/dev/null | grep -q "$IPA_FREE_APP_GROUP"; then
                  notes="$notes\n    (ad hoc signed with $IPA_FREE_APP_GROUP)"
                fi
              else
                echo "::warning::ad hoc signing failed; the free-apple-id IPA is unsigned"
              fi
            fi
            pack "$free" "$base-free-apple-id.ipa"
          fi

          ls -lh Firefly-*.ipa
          printf "%b\n" "$notes"
          {
            echo "## Unsigned IPA"
            echo
            echo "$name $version ($build), commit ${GITHUB_SHA:0:7}"
            echo
            echo '```'
            printf "%b\n" "$notes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Firefly-unsigned-ipa
          path: app/Firefly-*.ipa
          retention-days: 10
          compression-level: 0
          if-no-files-found: error
