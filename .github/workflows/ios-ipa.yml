# Build an unsigned IPA of this branch for the maintainer to sign himself (personal use, not
# distributed; DECISIONS.md D33). Same vendor and engine steps as ios-ci.yml, then a Release
# build for real iPhones (arm64) with code signing off, packed as Payload/DshIOS.app in
# Firefly.ipa and kept as a workflow artifact for 10 days.
#
# Runs when: this file changes on a feat/** branch, a tag ipa-* is pushed
# (git tag ipa-20261126 && git push origin ipa-20261126), or by hand (workflow_dispatch).
name: Unsigned IPA

on:
  push:
    branches: ["feat/**"]
    paths: [".github/workflows/ios-ipa.yml"]
    tags: ["ipa-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: ${{ vars.IOS_CI_RUNNER || 'xcode-27' }}
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: engine/package-lock.json

      - name: Xcode
        id: xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app | sed -E 's#.*/Xcode_([0-9.]+)\.app#\1#' | grep -E '^[0-9.]+$' | sort -t. -k1,1n -k2,2n -k3,3n | tail -1)"
          sudo xcode-select -s "/Applications/Xcode_${latest}.app"
          xcodebuild -version
          echo "version=$latest" >> "$GITHUB_OUTPUT"

      # The same caches as ios-ci.yml (same keys), so a CI run warms them for this one.
      - name: Cache nodejs-mobile
        id: nodejs-mobile
        uses: actions/cache@v5
        with:
          path: |
            vendor/nodejs-mobile/ios
            vendor/nodejs-mobile/rooted
          key: nodejs-mobile-${{ hashFiles('scripts/fetch-nodejs-mobile.sh') }}

      - name: Fetch nodejs-mobile
        if: steps.nodejs-mobile.outputs.cache-hit != 'true'
        run: scripts/fetch-nodejs-mobile.sh

      - name: Cache Python
        id: python
        uses: actions/cache@v5
        with:
          path: |
            vendor/python/ios
            vendor/python/rooted
          key: python-${{ hashFiles('scripts/fetch-python.sh') }}

      - name: Fetch Python
        if: steps.python.outputs.cache-hit != 'true'
        run: scripts/fetch-python.sh

      - name: Check NodeMobile imports
        run: scripts/check-root-imports.sh

      - name: Cache libgit2
        id: libgit2
        uses: actions/cache@v5
        with:
          path: |
            vendor/libgit2/Libgit2.xcframework
            vendor/libgit2/ios-arm64
            vendor/libgit2/ios-arm64-simulator
            vendor/libgit2/macos
          key: libgit2-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('scripts/build-libgit2.sh') }}

      - name: Build libgit2
        if: steps.libgit2.outputs.cache-hit != 'true'
        run: scripts/build-libgit2.sh

      - name: Cache FFmpeg
        id: ffmpeg
        uses: actions/cache@v5
        with:
          path: vendor/ffmpeg/FFmpeg.xcframework
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('scripts/fetch-ffmpeg.sh', 'scripts/build-ffmpeg.sh', 'native/ffmpeg/**') }}

      - name: Fetch FFmpeg
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: scripts/fetch-ffmpeg.sh

      - name: Assemble engine
        run: scripts/build-engine.sh

      - name: Install xcodegen
        run: command -v xcodegen >/dev/null || brew install xcodegen

      - name: Generate project
        working-directory: app
        run: xcodegen generate --quiet

      - name: Cache SwiftPM
        uses: actions/cache@v5
        with:
          path: app/build/DerivedData/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('app/project.yml') }}

      # Release, for devices, unsigned: the signer adds the identity and the provisioning
      # profiles. The Python post-build step signs ad hoc when no identity is set (project.yml).
      - name: Build (iOS device, unsigned)
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild -project DshIOS.xcodeproj -scheme DshIOS -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData -skipPackagePluginValidation \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build -quiet

      - name: Pack IPA
        working-directory: app
        env:
          # Repository variables (Settings > Secrets and variables > Actions > Variables), set to match
          # the maintainer's own provisioning profile. Empty: the single-profile IPA keeps the built IDs.
          IPA_BUNDLE_ID: ${{ vars.IPA_BUNDLE_ID }}
          IPA_APP_GROUP: ${{ vars.IPA_APP_GROUP }}
        run: |
          set -euo pipefail
          app="build/DerivedData/Build/Products/Release-iphoneos/DshIOS.app"
          [ -d "$app" ] || { echo "no $app" >&2; ls build/DerivedData/Build/Products || true; exit 1; }
          pb=/usr/libexec/PlistBuddy
          version="$($pb -c 'Print CFBundleShortVersionString' "$app/Info.plist")"
          build="$($pb -c 'Print CFBundleVersion' "$app/Info.plist")"
          name="$($pb -c 'Print CFBundleDisplayName' "$app/Info.plist")"
          built_id="$($pb -c 'Print CFBundleIdentifier' "$app/Info.plist")"
          base="Firefly-$version-$build"
          pack() { rm -rf ipa && mkdir -p ipa/Payload && cp -R "$1" ipa/Payload/ && (cd ipa && zip -qry "../$2" Payload); }

          # 1. Everything as built: the app, its share and Live Activity extensions, the watch app.
          pack "$app" "$base.ipa"

          # 2. For one provisioning profile with one explicit App ID: no extensions or watch app
          #    (each needs its own App ID), and the IDs the app reads at run time set to the
          #    profile's, so the signer has nothing to change.
          one="build/single-profile/DshIOS.app"
          rm -rf build/single-profile && mkdir -p build/single-profile && cp -R "$app" "$one"
          rm -rf "$one/PlugIns" "$one/Watch"
          overridden=no
          if [ -n "${IPA_BUNDLE_ID:-}" ]; then
            $pb -c "Set :CFBundleIdentifier $IPA_BUNDLE_ID" "$one/Info.plist"
            # BackgroundKeeper registers "<bundle id>.task.<uuid>": permit the new prefix too.
            $pb -c "Add :BGTaskSchedulerPermittedIdentifiers: string $IPA_BUNDLE_ID.task.*" "$one/Info.plist" 2>/dev/null || true
            overridden=yes
          fi
          if [ -n "${IPA_APP_GROUP:-}" ]; then
            $pb -c "Set :DshAppGroup $IPA_APP_GROUP" "$one/Info.plist"
            overridden=yes
          fi
          pack "$one" "$base-single-profile.ipa"
          ls -lh Firefly-*.ipa
          {
            echo "## Unsigned IPA"
            echo
            echo "- $name $version ($build), commit ${GITHUB_SHA:0:7}"
            echo "- \`$base.ipa\`: as built (bundle ID $built_id), with the share and Live Activity extensions and the watch app"
            echo "- \`$base-single-profile.ipa\`: no extensions or watch app; IDs set from repository variables: $overridden"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Firefly-unsigned-ipa
          path: app/Firefly-*.ipa
          retention-days: 10
          compression-level: 0
          if-no-files-found: error
